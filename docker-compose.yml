services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: async-processor-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      # - ./backend:/app
    environment:
      - DATABASE_URL=sqlite:///data/app.db
      - WORKER_COUNT=3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: async-processor-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
